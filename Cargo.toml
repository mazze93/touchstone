[workspace]
resolver = "2"
members = [
  "crates/touchstone-chain",
  "crates/touchstone-ledger",
  "crates/touchstone-integrity",
  "crates/touchstone-anchor",
  "crates/touchstone-cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["Touchstone"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
clap = { version = "=4.5.23", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
